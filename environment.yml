# conda / mamba environment for the analyses of mother machine results
#   conda env create -f environment.yml
#   conda activate mmanalysis
name: mmanalysis
channels:
  - conda-forge
  - nodefaults        # only conda-forge (no terms of service to accept for the Anaconda channels)
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
